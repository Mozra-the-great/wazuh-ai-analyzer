# Lint scope for the `lint` CI job. The rule set is pinned explicitly (ruff's
# classic default: pycodestyle subset + pyflakes) so a ruff bump by Dependabot
# never changes which rules apply. Widen it deliberately, in its own PR.
target-version = "py310"

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# analyzer.py is hash-pinned in checksums.sha256 and shipped to hosts by pin: a
# cosmetic edit would force a new pin without any behaviour change. The unused
# imports and two one-line `a; b` statements in it are harmless; clean them up
# together with the next functional change.
"analyzer.py" = ["F401", "E702"]
