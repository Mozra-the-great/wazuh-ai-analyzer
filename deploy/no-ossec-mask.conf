# Drop-in: do NOT hide /var/ossec from the service (fallback, not the default).
#
#   install -D -m 0644 no-ossec-mask.conf \
#     /etc/systemd/system/wazuh-ai-analyzer.service.d/no-ossec-mask.conf
#   systemctl daemon-reload && systemctl restart wazuh-ai-analyzer
#
# The main unit replaces /var/ossec with an empty read-only tmpfs and binds only the alert
# directory back in (TemporaryFileSystem= + BindReadOnlyPaths=). That needs a mount
# namespace in which tmpfs may be mounted. A container whose profile forbids it fails the
# service at start with status=226/NAMESPACE and a "Failed to set up mount namespace" /
# "Failed to mount tmpfs" line in `journalctl -u wazuh-ai-analyzer`. This drop-in goes back
# to the old rule: the whole file system is read-only (ProtectSystem=strict) and only the
# alert directory is named explicitly. The service then can read what the file permissions
# of /var/ossec allow (the alert group only, so in practice little more than the alerts),
# but the sandbox no longer hides the rest. Use it only when the main unit is refused, and
# tell the maintainers which container it was (INSTALL.md, "Check the sandbox").
#
# `install.sh --no-ossec-mask` installs it.
[Service]
TemporaryFileSystem=
BindReadOnlyPaths=
ReadOnlyPaths=-/var/ossec/logs/alerts
