# Drop-in for an UNPRIVILEGED container (LXC without privileges, Proxmox default).
#
#   install -D -m 0644 unprivileged-lxc.conf \
#     /etc/systemd/system/wazuh-ai-analyzer.service.d/unprivileged-lxc.conf
#   systemctl daemon-reload && systemctl restart wazuh-ai-analyzer
#
# An unprivileged container has no CAP_SYS_ADMIN and no access to the host's device
# cgroup, /sys/kernel and the kernel log. systemd then fails a service with status 218
# (CAPABILITIES) or 226 (NAMESPACE) as soon as it is asked for one of the options below.
# They are reset here; everything else of the main unit still applies. The seccomp-based
# options (SystemCallFilter, MemoryDenyWriteExecute, RestrictNamespaces, ...), the empty
# capability set, ProtectSystem, ProtectHome and PrivateTmp need no privileges on the
# host and stay on. Drop further lines only if `systemctl status` names them.
#
# TemporaryFileSystem=/var/ossec:ro (the main unit hides /var/ossec except the alert
# directory) is NOT reset here: a tmpfs is mountable in a user namespace. If the service
# still fails with 226/NAMESPACE and the journal says it cannot mount a tmpfs, add
# no-ossec-mask.conf as a second drop-in (install.sh --no-ossec-mask) and report it.
[Service]
# Needs mknod/bind mounts of devices.
PrivateDevices=false
# Remount /proc/sys, /sys, cgroup and the kernel log read-only (needs CAP_SYS_ADMIN).
ProtectKernelTunables=false
ProtectKernelLogs=false
ProtectControlGroups=false
# Needs the host's device cgroup (DeviceAllow) and CAP_SYS_TIME handling.
ProtectClock=false
ProtectKernelModules=false
# Mounts a new /proc.
ProtectProc=default
ProcSubset=all
