version: 2

# Dependabot keeps the SHA-pinned actions in .github/workflows fresh (convention C5)
# and the hash-pinned Python requirements.
#
# cooldown (zizmor audit dependabot-cooldown): a new release is proposed only after
# 7 days. If a package is compromised that is usually noticed within that window;
# without the wait the bad version would sit in a PR immediately. Every ecosystem
# needs its own cooldown entry.
#
# Dependabot cannot read repository secrets, so the Claude jobs skip its PRs
# (`github.actor != 'dependabot[bot]'`). Merge its PRs only after `pytest (3.10)`,
# `pytest (3.12)` and `lint` ran on them.
#
# pip and the hash pinning (requirements.in -> requirements.txt, requirements-lint.in
# -> requirements-lint.txt): dependabot-core recognises a pip-compile pair by the
# "autogenerated by pip-compile" header. It then re-runs pip-compile for the bumped
# package with the options recorded in the file (--generate-hashes, --strip-extras)
# and the Python version named in the header (3.12), so the sha256 hashes stay
# consistent. KEEP THAT HEADER INTACT when regenerating by hand, and regenerate with
# Python 3.12 (README, section "Abhängigkeiten (Hash-Pinning)"). It treats
# requirements.in as the manifest, so a bump of a pin there is proposed as a change
# of both files.
#
# Known limitation: checksums.sha256 lists the sha256 of requirements.txt, and a
# Dependabot PR does not update it, so the `lint` job fails on such a PR ("checksums.sha256
# matches the tracked files"). Fix it on the PR branch before merging:
#   git fetch origin <branch> && git checkout <branch>
#   sha256sum --text analyzer.py static/index.html requirements.txt > checksums.sha256
#   git commit -am "chore(deps): refresh checksums.sha256" && git push
# If a pip-compile run ever fails in Dependabot (e.g. a resolution conflict), bump the
# pin by hand with the command in requirements.in.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(actions)"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    # One PR per week for all pip bumps: each of them needs the same manual
    # checksums.sha256 refresh (see above), so one PR means one refresh.
    groups:
      python-dependencies:
        patterns:
          - "*"
